  max_sparse_keyframes: 20
  curriculum_start_step: 200000
  curriculum_end_step: 400000
  dense_min_fraction: 1.0
  endpoint_preset: kimodo_ee
  endpoint_subset_mode: random_nonempty
  include_root_ref_for_endpoints: true
  include_endpoint_rotations: true
  include_contact_pattern: true

training:
  seed: 20260715
  batch_size_per_rank: 16
  precision: bf16
  gradient_clip: 1.0
  weight_decay: 0.01
  ema_decay: 0.995
  ema_every: 10
  log_every: 20
  latest_every: 10000
  archive_every: 50000
  gradient_sync_mode: fixed_bucket
  gradient_sync_bucket_cap_mb: 100.0
  output_dir: /mnt/afs/mogeflow-control/outputs/hy273_multitask
