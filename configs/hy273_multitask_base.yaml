  num_heads: 8
  root_depth_double: 3
  root_depth_single: 6
  body_depth_double: 3
  body_depth_single: 6
  mlp_ratio: 2.0
  dropout: 0.0
  detach_root_bridge: true
  self_conditioning: false
  stats_variance_eps: 1.0e-5

flow:
